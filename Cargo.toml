[workspace]
resolver = "2"
members = [
    "crates/micro-types",
    "crates/micro-dirs",
    "crates/micro-config",
    "crates/micro-auth",
    "crates/micro-provider",
    "crates/micro-extensions",
    "crates/micro-rpc",
    "crates/micro-models",
    "crates/micro-tools",
    "crates/micro-sandbox",
    "crates/micro-session",
    "crates/micro-context",
    "crates/micro-skills",
    "crates/micro-prompts",
    "crates/micro-commands",
    "crates/micro-agent",
    "crates/micro-testkit",
    "crates/micro-mermaid",
    "crates/micro-mcp",
    "crates/micro-remote",
    "crates/micro-tui",
    "crates/micro-cli",
]

[workspace.package]
version = "0.1.13"
edition = "2021"
license = "MIT"
publish = false

[patch.crates-io]
citationberg = { git = "https://github.com/typst/citationberg", rev = "072ae9f46b503f6151481ecd02560ac34de5fb78" }

[workspace.dependencies]
micro-types = { path = "crates/micro-types" }
micro-dirs = { path = "crates/micro-dirs" }
micro-auth = { path = "crates/micro-auth" }
micro-config = { path = "crates/micro-config" }
micro-provider = { path = "crates/micro-provider" }
micro-extensions = { path = "crates/micro-extensions" }
micro-rpc = { path = "crates/micro-rpc" }
micro-models = { path = "crates/micro-models" }
micro-tools = { path = "crates/micro-tools" }
micro-sandbox = { path = "crates/micro-sandbox" }
micro-session = { path = "crates/micro-session" }
micro-context = { path = "crates/micro-context" }
micro-skills = { path = "crates/micro-skills" }
micro-prompts = { path = "crates/micro-prompts" }
micro-commands = { path = "crates/micro-commands" }
micro-agent = { path = "crates/micro-agent" }
micro-testkit = { path = "crates/micro-testkit" }
micro-mcp = { path = "crates/micro-mcp" }
micro-remote = { path = "crates/micro-remote" }
micro-tui = { path = "crates/micro-tui" }

anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
# Keep the crypto stack on digest 0.10.
aes-gcm = "0.10"
hkdf = "0.12"
rand = "0.8"
qrcode = { version = "0.14", default-features = false }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
clap = { version = "4", features = ["derive", "env"] }
crossterm = { version = "0.29", features = ["bracketed-paste", "event-stream"] }
futures = "0.3"
fs2 = "0.4"
ratatui = "0.30"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
tempfile = "3"
thiserror = "2"
unicode-normalization = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "io-util", "sync", "time", "signal", "net", "io-std"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
